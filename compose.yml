services:
  db:
    image: "postgres:18-alpine"
    container_name: "kimishinu-database"
    restart: unless-stopped
    volumes:
      - k_db:/var/lib/postgresql/18/main
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "kimishinu"
      PGDATA: "/var/lib/postgresql/18/main"
    env_file:
      - path: ".env"
        required: false
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB"]
      retries: 3
      interval: 5s
      timeout: 10s
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "kimishinu-backend"
    restart: unless-stopped
    env_file:
      - path: ".env"
        required: false
    ports:
      - 127.0.0.1:8080:8080

volumes:
  k_db: