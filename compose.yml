services:
  db:
    image: "postgres:18-alpine"
    container_name: "kimishinu-database"
    restart: unless-stopped
    volumes:
      - k_db:/var/lib/postgresql/18/main
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "kimishinu"
      POSTGRES_USER: "postgres"
      PGDATA: "/var/lib/postgresql/18/main"
    env_file:
      - path: ".env"
        required: false
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      retries: 3
      interval: 5s
      timeout: 10s
    networks:
      - backend
  loki:
    container_name: "kimishinu-loki"
    restart: unless-stopped
    image: "grafana/loki:3.7.9"
    networks:
      - telemetry
      - ui
  tempo:
    container_name: kimishinu-tempo
    restart: unless-stopped
    image: grafana/tempo:3.1.0 
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./internal/observability/tempo.yaml:/etc/tempo.yaml:ro
      - k_tempo:/var/tempo
    networks:
      - telemetry
      - ui
  
  otelcol:
    container_name: "kimishinu-otelcol"
    restart: unless-stopped
    image: otel/opentelemetry-collector:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - 4318:4318
    volumes:
      - "./internal/observability/otelcol.yaml:/etc/otelcol/config.yaml:ro"
    networks:
      - backend
      - telemetry
    depends_on:
      - loki
      - tempo
  grafana:
    container_name: "kimishinu-grafana"
    restart: unless-stopped
    image: "grafana/grafana:13.2.5-distroless-slim"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - 3000:3000
    volumes:
      - ./internal/observability/grafana.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - k_grafana:/var/lib/grafana
    networks:
      - ui

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "kimishinu-backend"
    restart: unless-stopped
    env_file:
      - path: ".env"
        required: false
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
volumes:
  k_db:
  k_otelcol:
  k_grafana:
  k_tempo:

networks:
  backend:
    name: backend
  telemetry:
    name: telemetry
  ui:
    name: ui

## My networking setup little diagram is:
## backend <-> telemetry <-> ui
## In which:
## ## backend --> database + alloy (They both interact with the backend)
## ## telemetry --> otelcol + loki + tempo (They all interact with each other)
## ## ui --> loki + grafana + tempo (They all interact with each other)