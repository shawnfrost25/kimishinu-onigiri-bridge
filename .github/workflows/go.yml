name: "Kimishinu-CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "./internal/**"
      - "./cmd/**"
      - "./infra/**"
  pull_request:
    branches:
      - main
    paths:
      - "./internal.**"
      - "./cmd/**"
      - "./infra/**"
  workflow_dispatch:
    inputs:
      tag_version:
        type: string
        description: "Select post-push version of image"
        default: "latest"
        required: true

env:
  ENV: "staging"
  GO_VERSION: "1.26"
  IMAGE_NAME: "prolepsis"
  TAG_VERSION: "${{ github.event.inputs.tag_version || 'latest' }}"
  AWS_REGION: "eu-north-1"

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: "Check out repo"
        uses: actions/checkout@v4

      - name: "Precise golang version"
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true

      - name: "Run code linter"
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: "Check out repo"
        uses: actions/checkout@v4

      - name: "Precise golang version"
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true

      - name: "Run golang tests"
        run: |
          go test -v -race ./...
  trivy-test:
    runs-on: ubuntu-24.04
    steps:
      - name: "Check out repo"
        uses: actions/checkout@v4

      - name: "Download trivy"
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: "Create trivy fs report"
        run: |
          trivy fs --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed --format json . -o trivy_fs_report.json

      - name: "Exit on critical severity"
        run: |
          trivy fs --exit-code 1 --severity CRITICAL --ignore-unfixed .

      - name: "Create artifact with the report"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-go-report
          path: trivy_fs_report.json
          retention-days: 1
  build:
    runs-on: ubuntu-24.04
    needs: [lint, test, trivy-test]
    steps:
      - name: "Check out repo"
        uses: actions/checkout@v4

      - name: "Setup Buildx Engine"
        uses: docker/setup-buildx-action@v3

      - name: "Build image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: "${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.TAG_VERSION }}"
          push: false
          load: true

      - name: "Upload artifact (docker image)"
        run: |
          docker save "${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.TAG_VERSION }}" -o mimi_image.tar

      - name: "Save image as artifact"
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: ./mimi_image.tar
  trivy-image:
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: "Check out repo"
        uses: actions/checkout@v4

      - name: "Download artifact (fetch image)"
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: "Load image"
        run: |
          docker load -i mimi_image.tar

      - name: "Download trivy"
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: "Create trivy image report"
        run: |
          trivy image --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed --format json "${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.TAG_VERSION }}" -o trivy_image_report.json

      - name: "Exit on critical severity"
        run: |
          trivy image  --exit-code 1 --severity CRITICAL --ignore-unfixed "${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.TAG_VERSION }}"

      - name: "Create artifact with the report"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-go-report
          path: trivy_image_report.json
          retention-days: 1
  push-ecr:
    runs-on: ubuntu-24.04
    environment: "staging"
    needs: trivy-image
    steps:
      - name: "Check out repo"
        uses: actions/checkout@v4

      - name: "Download artifact (fetch image)"
        uses: actions/download-artifact@v4
        with:
          name: mimi_image.tar

      - name: "Load image"
        run: |
          docker load -i mimi_image.tar

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Amazon ECR Login"
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Push to staging"
        run: |
          docker push "${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.TAG_VERSION }}"
