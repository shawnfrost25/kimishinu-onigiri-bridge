## What resources I used to write this config (Reminder for the future me):
# General -> https://grafana.com/docs/grafana/latest/datasources/loki/configure/

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
